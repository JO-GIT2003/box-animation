<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Simple Animation</title>
<style>
  body {
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    background: #282c34;
    margin: 0;
    color: white;
   
  }
  .box {
    width: 150px;
    height: 150px;
    background: #61dafb;
    border-radius: 20px;
    animation: bounce 2s infinite ease-in-out;
  }
  @keyframes bounce {
    0%, 100% {
      transform: translateY(0);
      box-shadow: 0 5px 15px rgba(97, 218, 251, 0.6);
    }
    50% {
      transform: translateY(-50px);
      box-shadow: 0 20px 30px rgba(97, 218, 251, 0.9);
    }
  }
</style>
</head>
<body>
  <div class="box"></div>
</body>
</html>
